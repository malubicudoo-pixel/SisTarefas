<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <h2>Bem-vindo</h2>
        <p class="subtitulo">Faça login para entrar</p>

       <form onsubmit="fazerLogin(event)">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

     <div class="campo">
         <label for="senha">Senha</label>
                <div class="senha-wrapper">
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                      <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)">
                        <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                 <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit">Entrar</button>

            <p class="link-alternativo">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </form>
    </div>

    <script>
        function alternarSenha(idCampo, botao) {
            const input = document.getElementById(idCampo);
            
            const olhoAberto = '<svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            const olhoFechado = '<svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

            if (input.type === "password") {
                input.type = "text";
                botao.innerHTML = olhoFechado;
            } else {
                input.type = "password";
                botao.innerHTML = olhoAberto;
            }
        }
        function fazerLogin(event) {
    event.preventDefault();

    const emailDigitado = document.getElementById("email").value;
    const senhaDigitada = document.getElementById("senha").value;

    // Busca os dados salvos no navegador
    const dadosSalvos = localStorage.getItem("usuarioCadastrado");

    if (!dadosSalvos) {
        alert("Nenhum usuário encontrado. Por favor, faça um cadastro primeiro.");
        return;
    }

    const usuario = JSON.parse(dadosSalvos);

    // Compara o que foi digitado com o que está salvo
    if (emailDigitado === usuario.email && senhaDigitada === usuario.senha) {
        window.location.href = "inicio.html"; // Libera a entrada
    } else {
        alert("E-mail ou senha incorretos!");
    }
}

    </script>
                </div>
     </div>
    </div>
</body>
</html>
